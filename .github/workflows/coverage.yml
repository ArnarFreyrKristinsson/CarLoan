# Uploads the coverage collected by CI to Codecov.
# Runs after every successful CI run. To turn it off:
#   gh workflow disable Coverage   (or Actions tab -> Coverage -> "Disable workflow")
name: Coverage

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  upload-coverage:
    # Only after a green CI run, and never for fork PRs (this workflow has access to secrets/OIDC).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download coverage from CI
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: ./coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./coverage
          use_oidc: true
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_branch: ${{ github.event.workflow_run.head_branch }}
          fail_ci_if_error: false
